<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Downloader - تحميل الفيديو</title>
  <meta name="description" content="أداة سريعة لتحميل الفيديوهات من منصات التواصل.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .logo span {
      color: #60a5fa;
    }

    .hero {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 750px;
      text-align: center;
    }

    h1 {
      font-size: clamp(32px, 7vw, 58px);
      margin-bottom: 18px;
    }

    .subtitle {
      color: #dbeafe;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .download-box {
      background: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 18px;
      display: flex;
      gap: 10px;
      backdrop-filter: blur(10px);
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      padding: 18px;
      border-radius: 12px;
      font-size: 16px;
      direction: ltr;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 0 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 20px;
      min-height: 25px;
      color: #bfdbfe;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 50px;
    }

    .feature {
      background: rgba(255,255,255,0.08);
      padding: 25px 15px;
      border-radius: 15px;
    }

    .feature h3 {
      margin-bottom: 8px;
    }

    .feature p {
      color: #cbd5e1;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #cbd5e1;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .download-box {
        flex-direction: column;
      }

      button {
        padding: 16px;
      }

      .features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Video<span>Save</span></div>
</header>

<section class="hero">
  <div class="container">

    <h1>تحميل الفيديو بسهولة</h1>

    <p class="subtitle">
      ألصق رابط الفيديو في الأسفل وابدأ التحميل
    </p>

    <div class="download-box">
      <input
        id="videoUrl"
        type="url"
        placeholder="ألصق رابط الفيديو هنا..."
      >

      <button onclick="downloadVideo()">
        تحميل
      </button>
    </div>

    <div id="message"></div>

    <div class="features">

      <div class="feature">
        <h3>⚡ سريع</h3>
        <p>واجهة بسيطة وسريعة الاستخدام.</p>
      </div>

      <div class="feature">
        <h3>📱 متجاوب</h3>
        <p>يعمل على الهاتف والكمبيوتر.</p>
      </div>

      <div class="feature">
        <h3>🔗 سهل</h3>
        <p>ضع الرابط واضغط على تحميل.</p>
      </div>

    </div>

  </div>
</section>

<footer>
  © 2026 VideoSave — جميع الحقوق محفوظة
</footer>

<script>
function downloadVideo() {
  const url = document.getElementById("videoUrl").value.trim();
  const message = document.getElementById("message");

  if (!url) {
    message.textContent = "⚠️ يرجى إدخال رابط الفيديو أولاً.";
    return;
  }

  message.textContent =
    "⏳ سيتم تجهيز الرابط... سنربط خدمة التحميل في المرحلة القادمة.";
}
</script>

</body>
</html>
